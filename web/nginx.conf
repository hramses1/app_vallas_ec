# Cloudflare Tunnel es la única entrada, así que CF-Connecting-IP identifica al visitante real
limit_req_zone $http_cf_connecting_ip zone=reports:10m rate=6r/m;
limit_req_zone $http_cf_connecting_ip zone=links:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/reports {
        limit_req zone=reports burst=3 nodelay;
        proxy_pass http://api:8000;
    }

    location = /api/maps-link {
        limit_req zone=links burst=5 nodelay;
        proxy_pass http://api:8000;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    # Páginas de administración: piden la clave para cualquier acción
    location ~ ^/(ubicar|reportes)$ {
        proxy_pass http://api:8000;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
    }
}
