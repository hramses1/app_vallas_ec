# Producción: la base y la API no exponen puertos. Solo el frontend escucha, y solo en este equipo,
# para que Cloudflare Tunnel le entregue el tráfico con HTTPS.
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: vallas
      POSTGRES_USER: vallas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vallas -d vallas"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vallas:${POSTGRES_PASSWORD}@db:5432/vallas
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Define ADMIN_TOKEN en .env}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - api

volumes:
  db_data:
